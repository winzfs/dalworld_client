name: Feature
about: 새 기능 추가 작업
labels: [feature]
body:
  - type: textarea
    id: goal
    attributes:
      label: 목적
      description: 이 기능이 필요한 이유와 기대 결과를 적어주세요.
    validations:
      required: true
  - type: dropdown
    id: repo_scope
    attributes:
      label: 영향 범위
      options:
        - client only
        - server only
        - client and server
        - docs only
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: 서버 권위 구조 확인
      description: 최종 판정은 어디서 이루어져야 하나요? 클라이언트는 어떤 미리보기/표시만 하나요?
      placeholder: 예) 서버가 건설 배치와 재료 차감을 확정하고, 클라이언트는 고스트와 요청 전송만 담당한다.
    validations:
      required: true
  - type: textarea
    id: protocol
    attributes:
      label: 프로토콜 변경 여부
      description: 메시지 타입, snapshot, event 변경이 필요한지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 예상 수정 파일
      placeholder: src/game/systems/..., src/protocol/messages.ts, docs/...
  - type: textarea
    id: validation
    attributes:
      label: 검증 방법
      placeholder: npm run check, 수동 테스트 경로, 모바일 확인 등
